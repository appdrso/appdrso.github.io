<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>DRSO — prévia responsiva</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e8ece7;color:#173c32;font:14px/1.5 system-ui,sans-serif}
    header{min-height:72px;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #cfd9ce;background:#fff}
    h1{font:700 15px/1.4 system-ui;margin:0}p{font-size:12px;color:#526759;margin:3px 0 0}
    label{display:flex;gap:10px;align-items:center;font-size:12px;font-weight:600}select{font:inherit;padding:10px;border:1px solid #b6c7b8;border-radius:8px;background:#fff;color:inherit}
    select:focus-visible{outline:3px solid #b99859;outline-offset:3px}main{overflow:auto;padding:24px;display:grid;justify-content:center}
    iframe{display:block;width:390px;height:844px;border:0;background:#f6f7f2;box-shadow:0 16px 48px #173c3226;outline:1px solid #c4cfc2;border-radius:18px}
    @media(max-width:540px){header{padding:12px;align-items:flex-start}main{padding:16px 0}p{max-width:210px}}
  </style>
</head>
<body>
  <header><div><h1>DRSO · Prévia responsiva</h1><p>Demonstração com dados fictícios. A largura simula o espaço disponível na tela.</p></div><label for="preview-width">Largura<select id="preview-width"><option value="360">360 px</option><option value="390" selected>390 px</option><option value="768">768 px</option></select></label></header>
  <main><iframe id="preview-frame" title="DRSO em tela de celular" src="./previa-v0.3.0.html"></iframe></main>
  <script>
    document.getElementById('preview-width').addEventListener('change',function(){
      if(['360','390','768'].includes(this.value))document.getElementById('preview-frame').style.width=this.value+'px';
    });
  </script>
</body>
</html>
