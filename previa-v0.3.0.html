<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102f29">
  <meta name="robots" content="noindex,nofollow">
  <title>DRSO — Demonstração 0.3.0</title>
  <style>
/* One visual system: pine green, neutral paper and restrained brass accents. */
:root{
  --forest:#113b30;
  --forest-2:#215746;
  --forest-dark:#0b2922;
  --ink:#1e3931;
  --muted:#5a6b63;
  --gold:#b69a60;
  --focus:#997b3d;
  --paper:#f4f5f1;
  --white:#fff;
  --line:#dce3dc;
  --soft:#edf3ec;
  --danger:#a53b35;
  --shadow:0 6px 24px #163c2f06,0 1px 3px #163c2f05;
  --radius:17px;
  --sidebar-width:254px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
a{color:var(--forest);text-underline-offset:3px}
h1,h2,h3,p{margin-top:0}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.035em;text-wrap:balance}
h1{font-size:40px;line-height:1.16}
h2{font-size:29px;line-height:1.25}
h3{font-size:16px;line-height:1.4;letter-spacing:-.012em}
svg{width:20px;height:20px;display:block;flex:none}
button svg{pointer-events:none}
::selection{color:var(--forest-dark);background:#e4dfc3}
.skip-link{position:fixed;top:-100px;left:12px;z-index:110;background:white;border:1px solid var(--line);border-radius:10px;padding:12px 18px}
.skip-link:focus{top:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.125em;text-transform:uppercase;color:var(--muted);line-height:1.5}
.muted{color:var(--muted)}
.small{font-size:13px}
.gold{color:var(--gold)}
.hidden{display:none!important}
.stack{display:grid;gap:20px}
.row{display:flex;gap:12px;align-items:center}
.spread{justify-content:space-between}
.wrap{flex-wrap:wrap}
.full{grid-column:1/-1}
.mobile-only{display:none}

/* Controls and form groups. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;padding:12px 18px;border-radius:10px;font-weight:650;text-decoration:none;min-height:48px;background:var(--forest);color:white;line-height:1.4;transition:background .18s,border-color .18s,box-shadow .18s}
.btn:hover:not(:disabled){background:var(--forest-2);box-shadow:0 3px 10px #143c3212}
.btn:active:not(:disabled){box-shadow:inset 0 2px 4px #071e2629}
.btn.secondary{background:white;border-color:#ccd8cc;color:var(--forest)}
.btn.secondary:hover:not(:disabled){background:var(--soft);border-color:#acc1ac}
.btn.ghost{background:transparent;color:var(--forest);padding:10px 12px}
.btn.ghost:hover:not(:disabled){background:#e6ede3;box-shadow:none}
.btn.danger{background:var(--danger);color:white}
.btn.danger:hover:not(:disabled){background:#8f302a}
.btn.small{min-height:44px;padding:10px 13px;font-size:13px}
.icon-btn{display:inline-flex;justify-content:center;align-items:center;width:44px;height:44px;padding:0;flex:none;background:white;border:1px solid var(--line);border-radius:10px;color:var(--forest);transition:background .18s,border-color .18s}
.icon-btn:hover:not(:disabled){background:var(--soft);border-color:#b7c9b6}
.text-btn{display:inline-flex;align-items:center;min-height:44px;padding:8px 0;border:0;background:transparent;color:var(--forest);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;font-size:13px;font-weight:650;text-align:left}
.text-btn:hover{color:var(--forest-2)}
.field{display:grid;gap:8px;min-width:0}
.field label{font-size:13px;font-weight:650;line-height:1.45}
.field label .muted{font-weight:400}
.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid #cbd6cb;background:#fff;border-radius:10px;padding:12px 14px;color:var(--ink);min-height:50px;font-size:16px;line-height:1.45;transition:border-color .18s,box-shadow .18s}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:1}
.field input:hover:not([readonly]),.field select:hover,.field textarea:hover{border-color:#9fb39f}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--forest);box-shadow:0 0 0 3px #1b51351c;outline:none}
.field input[readonly]{background:#f1f4ee;color:var(--muted);border-color:var(--line)}
.field input[aria-invalid="true"],.field textarea[aria-invalid="true"]{border-color:var(--danger)}
.field textarea{resize:vertical;min-height:96px}
.field small{color:var(--muted);font-size:12px;line-height:1.5}
.password-field{position:relative;min-width:0}
.password-field input{padding-right:58px}
.password-field button{position:absolute;right:3px;top:3px;width:44px;height:44px;border:0;background:transparent;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.password-field button:hover{color:var(--forest);background:var(--soft)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.form-section{display:grid;gap:18px;min-width:0;margin:0;padding:23px 0 0;border:0;border-top:1px solid var(--line)}
.form-section legend{float:left;width:100%;padding:0;margin:0 0 2px;font-size:14px;font-weight:700;color:var(--forest);letter-spacing:-.005em}
.form-section legend+*{clear:both}
.form-section .form-grid{min-width:0}
.form-section-note,.form-section-copy{font-size:13px;line-height:1.65;color:var(--muted);margin:-8px 0 0}
.auth-form-sections{display:grid;gap:25px}
.auth-form-sections>.form-section:first-child{padding-top:19px}
.checkbox{display:flex;align-items:flex-start;gap:11px;font-size:14px;line-height:1.6;min-height:44px;padding:8px 0;cursor:pointer}
.checkbox input{width:20px;height:20px;accent-color:var(--forest);flex:none;margin:1px 0 0}
.notice{padding:15px 17px;border-radius:10px;font-size:14px;line-height:1.65;background:var(--soft);border:1px solid #d7e3d4;color:var(--forest);overflow-wrap:anywhere}
.notice.small{font-size:13px}
.notice.warning{background:#fbf7ec;border-color:#e8dcbb;color:#725923}
.notice.error{background:#fcf0ed;border-color:#edc8c0;color:#96372e}
.notice summary{cursor:pointer;font-weight:650;min-height:24px}
.notice summary:focus-visible{border-radius:3px}
.form-error:empty{display:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;background:var(--soft);color:var(--forest);white-space:nowrap;line-height:1.5}
.badge.demo{background:#f1e7ce;color:#715825}
.badge.closed{background:#f0efe8;color:#656356}
.badge.inactive{background:#faeae5;color:#983e33}

/* The white-backed official JPEG sits on a light mount and keeps its original colors. */
.crest{object-fit:contain;display:block;flex:none}
.unit-crest{object-fit:contain;display:block;flex:none}
.brand{display:flex;align-items:center;gap:13px}
.brand>div{min-width:0}
.brand .crest{width:50px;height:61px}
.brand .unit-crest{width:48px;height:58px;padding:3px;background:#fff;border:1px solid #e6dfc9;border-radius:7px;mix-blend-mode:normal;box-shadow:0 2px 9px #03130d1f}
.brand-name{font-size:30px;letter-spacing:.055em;font-weight:750;line-height:1.05}
.brand-caption{font-size:10px;letter-spacing:.075em;text-transform:uppercase;color:#c4d6ca;margin-top:7px;line-height:1.6}

/* Entry: the unit anchors the page, while the form remains the primary action. */
.auth-page{min-height:100vh;display:grid;grid-template-columns:minmax(340px,43%) minmax(0,1fr);align-items:stretch;background:var(--forest-dark)}
.auth-story{padding:36px clamp(30px,4vw,66px);background:radial-gradient(ellipse at 50% 32%,#234d3d 0,#12372d 46%,#0b2922 100%);color:#f7f7ef;display:flex;flex-direction:column;position:sticky;top:0;align-self:start;min-height:100vh;min-height:100dvh;height:auto;overflow:hidden;isolation:isolate}
.auth-story:before{content:"";position:absolute;inset:20px;border:1px solid #c9ae7320;border-radius:3px;pointer-events:none;z-index:-1}
.auth-story:after{content:"";position:absolute;width:480px;height:480px;border:1px solid #b899571d;border-radius:50%;left:calc(50% - 240px);top:calc(43% - 240px);box-shadow:0 0 0 52px #b8995705,0 0 0 106px #b8995703;pointer-events:none;z-index:-1}
.institution-brand{display:flex;align-items:center;gap:11px;min-width:0;padding:0 0 19px;border-bottom:1px solid #e2eadb18}
.institution-brand .crest{width:32px;height:41px}
.institution-brand>div{min-width:0}
.institution-brand strong{display:block;font-size:12px;font-weight:600;letter-spacing:.01em;color:#e5ebe1;line-height:1.45}
.institution-brand span{display:block;font-size:10px;color:#bacdc0;line-height:1.5;margin-top:3px;letter-spacing:.08em;text-transform:uppercase}
.unit-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;margin:auto 0;padding:30px 0 22px;position:relative}
.unit-hero>div{min-width:0;max-width:390px}
.unit-hero .unit-emblem{width:214px;height:244px;max-width:100%;padding:12px;background:#fff;border:1px solid #e7dcc1;border-radius:15px;mix-blend-mode:normal;box-shadow:0 12px 32px #03130d33,0 0 0 5px #d0b97810}
.unit-label{font-size:30px;font-weight:750;line-height:1.2;letter-spacing:.09em;color:#f9faef}
.unit-subtitle{font-size:12px;font-weight:500;line-height:1.5;letter-spacing:.18em;text-transform:uppercase;color:#d3bd88;margin-top:8px}
.unit-tagline{font-family:Georgia,"Times New Roman",serif;font-size:26px;font-weight:400;line-height:1.3;letter-spacing:-.02em;color:#e7ebdf;margin:20px 0 0;text-wrap:balance}
.auth-story .brand{margin:0 0 16px;justify-content:center}
.auth-story .brand-name{font-size:36px}
.story-content{max-width:390px;margin:0 auto;padding:8px 0 0;text-align:center}
.story-content .eyebrow{color:#d2bd89;font-size:10px}
.story-content h1{font-size:31px;line-height:1.2;margin:10px 0 14px;letter-spacing:-.035em}
.story-content .gold{color:#d4bd83}
.story-content p{color:#c8d8cb;font-size:13px;line-height:1.75;margin-bottom:16px}
.story-line{height:1px;background:#c2a56766;width:44px;margin:20px auto}
.story-points{display:flex;justify-content:center;gap:10px 20px;flex-wrap:wrap;padding-top:5px}
.story-point{display:flex;gap:7px;align-items:center;font-size:11px;line-height:1.5;color:#c5d7c8}
.story-point svg{color:#cab27a;width:15px;height:15px}
.auth-story footer{font-size:9px;letter-spacing:.1em;color:#a8bfaf;line-height:1.8;padding-top:24px;text-align:center;flex:none}
.auth-panel{padding:44px clamp(30px,4.5vw,78px);display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:0;background:var(--paper)}
.auth-panel-inner{width:100%;max-width:522px;background:white;border:1px solid var(--line);border-radius:23px;padding:35px 36px;box-shadow:0 16px 56px #113b3007,0 2px 7px #113b3003}
.auth-topline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:31px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.auth-topline .eyebrow{font-size:10px;letter-spacing:.115em;max-width:260px}
.auth-topline .badge{flex:none}
.auth-panel-inner>.eyebrow{display:block;color:#657556;font-size:10px}
.auth-panel h2{font-size:36px;margin:11px 0 16px;line-height:1.17}
.auth-panel .intro{color:var(--muted);font-size:14px;line-height:1.75;margin-bottom:25px}
.auth-panel form{display:grid;gap:19px}
.auth-panel form.auth-form-sections{gap:23px}
.auth-panel .btn.primary{width:100%;margin-top:2px;min-height:52px}
.auth-footer{margin-top:26px;border-top:1px solid var(--line);padding-top:15px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:var(--muted);line-height:1.65}
.auth-footer .text-btn{font-size:12px;flex:none}
.demo-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.demo-actions>p{grid-column:1/-1;margin:0 0 4px;font-size:12px}
.demo-actions .btn{font-size:12px;padding:10px;min-height:44px}
.identity{border:1px solid #d4e0d0;border-left:3px solid var(--gold);background:#f4f7ef;border-radius:11px;padding:17px;display:flex;gap:14px;align-items:center;margin:21px 0 14px}
.identity>div:last-child{min-width:0}
.identity-avatar{background:#e7eee1;border:1px solid #dbe5d5;border-radius:10px;width:44px;height:48px;display:grid;place-items:center;color:var(--forest);flex:none}
.identity-name{font-weight:700;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.identity-meta{font-size:12px;color:var(--muted);margin-top:4px}
.back-link{margin:-8px 0 15px;display:flex;width:max-content;max-width:100%;min-height:44px;align-items:center;gap:7px;color:var(--muted);background:transparent;border:0;padding:8px 0;font-size:12px;text-align:left;line-height:1.5}
.back-link:hover{color:var(--forest);text-decoration:underline;text-underline-offset:4px}
.back-link svg{width:17px;height:17px}

/* Workspace, persistent identity and navigation. Cards deliberately stay opaque. */
.shell{min-height:100vh;display:grid;grid-template-columns:var(--sidebar-width) minmax(0,1fr)}
.sidebar{background:linear-gradient(170deg,#10392e,#0b2b23);color:white;padding:28px 18px 20px;position:fixed;inset:0 auto 0 0;width:var(--sidebar-width);display:flex;flex-direction:column;z-index:10;overflow:auto;scrollbar-width:thin;scrollbar-color:#496958 transparent}
.sidebar .brand{gap:13px;padding:0 9px 26px;margin-bottom:25px;border-bottom:1px solid #d2dec71d}
.sidebar .brand .crest{width:48px;height:60px}
.sidebar .brand-name{font-size:29px}
.sidebar .brand-caption{font-size:9px;letter-spacing:.065em;line-height:1.6;margin-top:7px}
.nav-label{padding:0 14px;margin-bottom:13px;color:#9fbba8;font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase}
.nav-links{display:grid;gap:6px}
.nav-item{display:flex;gap:12px;align-items:center;padding:13px 14px;border:1px solid transparent;border-radius:10px;background:transparent;color:#c4d7c8;text-align:left;font-size:13px;line-height:1.5;min-height:49px;position:relative;transition:background .18s,color .18s}
.nav-item svg{width:18px;height:18px}
.nav-item.active{background:#f8fbef14;border-color:#e5ecd314;color:white;font-weight:650;box-shadow:0 2px 5px #031c1710}
.nav-item.active:before{content:"";height:19px;width:3px;background:#c4a76c;position:absolute;left:0;top:calc(50% - 9.5px);border-radius:2px}
.nav-item:hover{background:#f8fbef0d;color:white}
.sidebar-foot{margin-top:auto;padding-top:28px}
.institution{border-top:1px solid #ffffff17;padding:19px 12px;color:#a9c1b0;font-size:10px;line-height:1.9;overflow-wrap:anywhere}
.sidebar-user{display:flex;gap:10px;align-items:center;padding:17px 10px;border-top:1px solid #ffffff17}
.sidebar-user>div:last-child{min-width:0}
.avatar{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:#ffffff12;border:1px solid #ffffff0c;font-size:12px;font-weight:650;flex:none}
.sidebar-user strong{font-size:12px;display:block;overflow-wrap:anywhere}
.sidebar-user span{color:#b1c9b8;font-size:10px;display:block;margin-top:3px}
.logout-btn{background:transparent;border:0;border-radius:9px;color:#bad1c1;display:flex;align-items:center;gap:10px;padding:11px 12px;font-size:12px;min-height:44px}
.logout-btn:hover{background:#ffffff0d;color:white}
.logout-btn svg{width:17px;height:17px}
.workspace{grid-column:2;min-width:0;position:relative;isolation:isolate;background:var(--paper)}
.workspace-watermark{position:fixed;top:118px;right:clamp(15px,3.5vw,76px);width:clamp(260px,34vw,520px);height:auto;max-height:72vh;object-fit:contain;filter:grayscale(1);mix-blend-mode:multiply;opacity:.05;pointer-events:none;user-select:none;z-index:0}
.workspace-watermark .unit-crest{width:100%;height:auto;mix-blend-mode:normal}
.workspace-content{position:relative;z-index:1;min-width:0}
.topbar{min-height:78px;display:flex;align-items:center;justify-content:space-between;padding:17px 40px;background:#fbfcf8;border-bottom:1px solid var(--line);gap:20px}
.topbar-title{font-size:12px;color:var(--muted);min-width:0;letter-spacing:.01em}
.topbar-meta{display:flex;align-items:center;gap:17px;font-size:11px;color:var(--muted);min-width:0}
.topbar-meta>span:last-child{font-weight:650;color:var(--forest);overflow-wrap:anywhere}
.topbar-dot{width:6px;height:6px;background:#59855f;border-radius:50%;display:inline-block;margin-right:6px;box-shadow:0 0 0 3px #59855f12}
.mobile-brand,.bottom-nav{display:none}
.main{padding:35px 40px 32px;max-width:1500px;margin:auto;min-width:0}
.page-heading{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:27px;position:relative}
.page-heading>div:first-child{min-width:0}
.page-heading h1{margin:8px 0 11px;font-size:37px;letter-spacing:-.04em}
.page-heading p{font-size:13px;line-height:1.75;color:var(--muted);margin-bottom:0;max-width:640px}
.page-heading>.btn{flex:none}
.page-date{font-size:11px;color:var(--muted);padding-bottom:4px;white-space:nowrap}
.card{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-pad{padding:27px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.section-heading h2,.section-heading h3{font-family:inherit;font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0}
.section-heading p{margin:0;font-size:12px;color:var(--muted)}
.app-footer{display:flex;justify-content:space-between;gap:16px;font-size:10px;line-height:1.75;color:var(--muted);margin-top:29px;padding-top:17px;border-top:1px solid var(--line)}
.section-note{margin:17px 0 0;font-size:12px;line-height:1.7;color:var(--muted)}
.app-error{margin-bottom:20px}

/* Calendar: predictable states, generous day targets and month-scoped totals. */
.calendar-layout{display:grid;grid-template-columns:minmax(0,1fr) 282px;gap:22px;align-items:start}
.calendar-card{padding:24px}
.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:17px}
.calendar-toolbar h2{font-family:inherit;font-size:22px;font-weight:650;letter-spacing:-.035em;margin:0;line-height:1.4}
.calendar-nav{display:flex;gap:5px;align-items:center;flex:none}
.calendar-nav .icon-btn{width:44px;height:44px}
.calendar-nav .icon-btn svg{width:17px;height:17px}
.calendar-nav .btn{min-height:44px;padding:10px 13px;font-size:12px}
.calendar-context{font-size:12px;line-height:1.65;color:var(--muted);margin:0 0 20px;padding:10px 12px;background:#f5f7f1;border-radius:8px;border:1px solid #e5eadd}
.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calendar-weekdays{padding-bottom:11px}
.calendar-weekdays span{text-align:center;font-size:10px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.calendar-day{position:relative;border:1px solid #e7ece2;border-radius:9px;background:#f8faf5;min-width:0;min-height:86px;padding:10px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;color:var(--ink);font-size:13px;transition:background .16s,border-color .16s,box-shadow .16s}
.calendar-day:hover:not(:disabled){border-color:#9eb398;background:#eff5e9;box-shadow:0 2px 8px #244e3512}
.calendar-day:focus-visible{z-index:1;outline-offset:1px}
.calendar-day.empty{visibility:hidden}
.calendar-day.past{background:#fbfcf9;color:#74806e;border-color:#edf0e7}
.calendar-day.today{border-color:#b89b5b;background:#fcf7e9;box-shadow:inset 0 0 0 1px #b899571f}
.calendar-day.mine{background:#e7f0df;border-color:#c5d8b8;color:#224b2e}
.calendar-day.closed{background:repeating-linear-gradient(135deg,#f1f2ed,#f1f2ed 6px,#e4e9de 6px,#e4e9de 7px);border-color:#dce2d3;color:#626b59}
.calendar-day.outside{color:#74806b}
.calendar-day.selected{background:var(--forest);color:white;border-color:var(--forest);box-shadow:inset 0 0 0 1px var(--forest)}
.calendar-day.selected:hover:not(:disabled){background:var(--forest-2);border-color:var(--forest-2)}
.calendar-day.mine.today{border-color:#a4843e}
.day-num{font-size:16px;font-weight:650;line-height:1.2;font-variant-numeric:tabular-nums}
.day-tag{font-size:9px;font-weight:600;line-height:1.4;max-width:100%;overflow-wrap:normal}
.day-count{display:flex;align-items:center;gap:4px;font-size:12px;line-height:1.35;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.day-count svg{width:12px;height:12px}
.day-dot{position:absolute;right:8px;top:13px;width:5px;height:5px;border-radius:50%;background:#a5833d}
.calendar-legend{display:flex;gap:10px 16px;flex-wrap:wrap;margin-top:20px;padding-top:17px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.6}
.calendar-legend span{display:flex;align-items:center;gap:7px}
.legend-swatch{display:inline-block;width:10px;height:10px;flex:none;border-radius:3px;background:#e0edd6;border:1px solid #a5c391}
.legend-swatch.today{background:#fcf7e9;border-color:#a5833d}
.legend-swatch.closed{background:repeating-linear-gradient(135deg,#f1f2ec,#f1f2ec 2px,#d5decb 2px,#d5decb 3px);border-color:#acbaa0}
.bulk-bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:18px;padding:14px;border:1px solid #cedec6;background:#edf4e8;border-radius:11px;font-size:13px;line-height:1.5}
.bulk-bar>.row{margin-left:auto;flex-wrap:wrap}
.sidebar-section .card{padding:23px}
.sidebar-section h3{margin-bottom:9px;font-size:16px}
.count-card{background:var(--forest)!important;color:white;border:1px solid var(--forest);position:relative;overflow:hidden}
.count-card .eyebrow{color:#c4d8c5;font-size:10px}
.count-card .big-number{font-size:59px;font-weight:400;line-height:1;margin:21px 0 5px;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.count-card p{font-size:12px;line-height:1.75;color:#ccddcb;margin:8px 0 0;max-width:210px}
.count-card:after{content:"";position:absolute;right:-52px;bottom:-55px;width:174px;height:174px;border-radius:50%;border:1px solid #b8995747;box-shadow:0 0 0 25px #b8995707;pointer-events:none}
.date-list{margin-top:17px;display:grid;gap:0}
.date-list-item{display:flex;align-items:center;gap:11px;padding:14px 0;border-top:1px solid var(--line)}
.date-list-item:last-child{padding-bottom:0}
.date-tile{width:45px;flex:none;height:50px;border-radius:9px;background:#f4f6ef;border:1px solid #e4e9dc;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;line-height:1.5;color:var(--muted);text-transform:uppercase}
.date-tile b{font-size:19px;line-height:1.2;color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.date-list-item .date-info{flex:1;min-width:0}
.date-info strong{font-size:13px;display:block;font-weight:650}
.date-info span{font-size:11px;color:var(--muted);display:block;margin-top:3px}
.date-list-item .icon-btn{width:44px;height:44px;border:0;background:transparent}
.date-list-item .icon-btn:hover{background:var(--soft)}
.date-list-item .icon-btn svg{width:17px;height:17px}
.empty-state{padding:29px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.75;max-width:460px;margin:0 auto}
.empty-state svg{margin:0 auto 13px;color:#829472;width:29px;height:29px}
.info-card{padding:18px 20px;background:#eef2e7;border-radius:13px;border:1px solid #dce4d2;display:flex;gap:11px}
.info-card svg{width:18px;height:18px;color:#83723e;flex:none;margin-top:2px}
.info-card p{font-size:12px;line-height:1.8;color:#5e6b4d;margin-bottom:0}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:24px}
.metric{padding:21px 22px;position:relative}
.metric-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;font-size:12px;line-height:1.55;color:var(--muted)}
.metric-top svg{width:18px;height:18px;color:#718861;margin-top:1px}
.metric strong{display:block;font-size:40px;font-weight:450;line-height:1.2;letter-spacing:-.045em;margin-top:15px;color:var(--forest);font-variant-numeric:tabular-nums}
.metric-context{display:block;color:var(--muted);font-size:10px;line-height:1.6;margin-top:6px}
.metric:first-child{background:var(--forest);color:white;border-color:var(--forest)}
.metric:first-child .metric-top{color:#d2e2cc}
.metric:first-child .metric-top svg{color:#c7b481}
.metric:first-child strong{color:white}
.metric:first-child .metric-context{color:#bbd2bc}

/* Search, personnel, profile and settings. */
.toolbar{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:19px}
.toolbar-search{flex:1;min-width:0;max-width:410px;display:grid;gap:8px}
.toolbar-search-label{display:block;font-size:12px;font-weight:650;color:var(--ink);line-height:1.5}
.toolbar-search-label+.search-field{margin-top:8px}
.toolbar-search .toolbar-search-label+.search-field{margin-top:0}
.toolbar-search .search-field{max-width:none}
.toolbar>#roster-count{padding:0 2px 14px;white-space:nowrap;font-size:12px}
.search-field{position:relative;max-width:410px;flex:1;min-width:0}
.search-field svg{position:absolute;left:15px;top:15px;width:19px;height:19px;color:var(--muted);pointer-events:none}
.search-field input{width:100%;min-height:50px;padding:12px 15px 12px 44px;border:1px solid #cbd6cb;border-radius:10px;background:white;color:var(--ink);font-size:16px;line-height:1.45;transition:border-color .18s,box-shadow .18s}
.search-field input::placeholder{color:var(--muted);opacity:1}
.search-field input:hover{border-color:#9fb39f}
.search-field input:focus{border-color:var(--forest);box-shadow:0 0 0 3px #1b51351c;outline:none}
.table-wrap{width:100%;overflow:auto;scrollbar-width:thin;scrollbar-color:#b3c5aa transparent}
table{width:100%;border-collapse:collapse;text-align:left;font-size:13px;line-height:1.55}
th{font-size:10px;text-transform:uppercase;letter-spacing:.085em;color:var(--muted);font-weight:700;background:#f7f9f3;padding:16px 19px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:18px 19px;border-bottom:1px solid #e7ece3;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafcf7}
.person-cell strong{display:block;font-size:13px;font-weight:650;color:var(--forest)}
.person-cell small{color:var(--muted);font-size:11px;display:block;margin-top:4px}
.status-cell .small{display:block;margin-top:5px;font-size:11px}
.table-actions{display:flex;gap:3px;justify-content:flex-end}
.table-actions .icon-btn{width:44px;height:44px;border:0;background:transparent}
.table-actions .icon-btn:hover{background:var(--soft)}
.table-actions svg{width:17px;height:17px}
.profile-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:23px;max-width:1050px;align-items:start}
.profile-layout>.card:only-child{grid-column:1/-1;max-width:560px;width:100%}
.profile-summary{display:flex;gap:14px;align-items:center;margin-bottom:24px;padding-bottom:23px;border-bottom:1px solid var(--line)}
.profile-summary>div:last-child{min-width:0}
.profile-summary .avatar{background:var(--soft);border:1px solid #d9e5d3;width:53px;height:55px;font-size:16px;color:var(--forest);border-radius:12px}
.profile-summary h3{margin:0;overflow-wrap:anywhere}
.profile-summary p{margin:5px 0 0;font-size:12px;color:var(--muted)}
.card-heading{margin-bottom:23px}
.card-heading h2{font-family:inherit;font-size:20px;font-weight:650;letter-spacing:-.025em;margin-bottom:9px}
.card-heading p{font-size:13px;line-height:1.75;color:var(--muted);margin-bottom:0}
.card-heading>.eyebrow>svg{width:35px;height:35px;color:var(--forest);background:var(--soft);border:1px solid #dce6d7;border-radius:9px;padding:7px}
.settings-card{max-width:810px}
.settings-card .form-section:first-child{border-top:0;padding-top:0}
.settings-toggle{padding:23px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:24px;align-items:flex-start;margin:24px 0}
.form-section .settings-toggle{margin:0;padding-top:0;border-top:0;padding-bottom:19px}
.settings-toggle .copy{flex:1;min-width:0}
.settings-toggle strong{display:block;font-size:14px;line-height:1.5}
.settings-toggle p{font-size:13px;color:var(--muted);line-height:1.75;margin:8px 0 0}
.switch{position:relative;display:inline-block;width:50px;height:44px;flex:none;margin-top:-5px;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:8px 0;background:#9fac96;border:1px solid #909f86;border-radius:20px;cursor:pointer;transition:background .2s,border-color .2s}
.switch span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:white;border-radius:50%;box-shadow:0 1px 3px #102d2633;transition:transform .2s}
.switch input:checked+span{background:var(--forest);border-color:var(--forest)}
.switch input:checked+span:before{transform:translateX(22px)}
.switch input:focus-visible+span{outline:3px solid var(--focus);outline-offset:3px}
.audit-caption{padding:18px 20px;margin:0;font-size:12px;color:var(--muted);line-height:1.7;border-bottom:1px solid var(--line);text-align:left;background:#fff;caption-side:top}
.audit-detail{max-width:340px;overflow-wrap:anywhere;color:var(--muted);font-size:12px;line-height:1.65}
.audit-table:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.audit-table td:first-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.audit-table .badge{max-width:240px;white-space:normal;overflow-wrap:anywhere}

/* Dialogs and in-place feedback. */
.loading{padding:64px 24px;text-align:center;color:var(--muted);min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.spinner{display:inline-block;flex:none;width:25px;height:25px;border:2px solid #d8e2d1;border-top-color:var(--forest);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
.loading p{font-size:13px;line-height:1.7;margin:0}
.loading>.btn{margin-top:22px}
@keyframes spin{to{transform:rotate(360deg)}}
dialog{border:1px solid var(--line);padding:0;border-radius:19px;width:calc(100% - 32px);max-width:620px;color:var(--ink);background:white;box-shadow:0 24px 96px #06291e40;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#b3c5aa transparent}
dialog::backdrop{background:#071f19a6;backdrop-filter:blur(3px)}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;padding:25px 27px 22px;border-bottom:1px solid var(--line);gap:18px;background:#f7f9f2}
.modal-header>div{min-width:0}
.modal-header h2{font-size:30px;margin:7px 0 0;overflow-wrap:anywhere;hyphens:auto}
.modal-header .icon-btn{width:44px;height:44px;border:1px solid #d4decf;background:white}
.modal-header .icon-btn:hover{background:var(--soft)}
.modal-header .icon-btn svg{width:18px;height:18px}
.modal-body{padding:24px 27px}
.modal-body>p{font-size:14px;color:var(--muted);line-height:1.75}
.modal-body>p:last-child{margin-bottom:0}
.modal-body>p b{color:var(--ink);font-weight:650}
.modal-body .form-section:first-child{border-top:0;padding-top:0}
.modal-footer{padding:18px 27px 23px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid #e7ede0;background:#fff;flex-wrap:wrap}
.modal-footer .btn{font-size:13px;min-height:48px}
.modal-status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.modal-roster{max-height:275px;overflow:auto;margin:18px 0 23px;scrollbar-width:thin;scrollbar-color:#b3c5aa transparent;padding-right:4px}
.modal-roster-item{padding:15px 0;border-bottom:1px solid var(--line)}
.modal-roster-item:first-child{padding-top:5px}
.modal-roster-item strong{font-size:13px}
.modal-roster-item p{font-size:12px;line-height:1.75;color:var(--muted);margin:5px 0 0}
.activation-code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:27px;text-align:center;letter-spacing:.13em;padding:25px 16px;background:#f0f5e9;border:1px dashed #9bb18a;border-radius:11px;margin:23px 0;color:var(--forest);overflow-wrap:anywhere}
.toast-region{position:fixed;bottom:24px;right:24px;z-index:100;max-width:400px;display:grid;gap:10px;pointer-events:none}
.toast{background:var(--forest);color:white;box-shadow:0 10px 40px #102d262b;border:1px solid #ffffff15;border-radius:12px;padding:16px 18px;display:flex;align-items:flex-start;gap:11px;font-size:13px;line-height:1.65;animation:appear .2s ease-out;overflow-wrap:anywhere}
.toast.error{background:#963d32}
.toast svg{width:18px;height:18px;flex:none;margin-top:2px}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Compact desktop and tablet. */

  .calendar-day{min-height:102px}
  .auth-story{padding:44px 64px}
  .unit-hero .unit-emblem{width:230px;height:262px;padding:13px}

}

  .unit-tagline{font-size:24px}

  .page-heading{align-items:flex-start;flex-wrap:wrap;gap:16px}

  .auth-page{grid-template-columns:41% minmax(0,1fr)}

  .institution-brand{gap:9px}
  .institution-brand .crest{width:28px;height:37px}
  .institution-brand strong{font-size:10px}
  .institution-brand span{font-size:9px;letter-spacing:.04em}
  .unit-hero{padding-top:26px}
  .unit-hero .unit-emblem{width:194px;height:222px;padding:11px}
  .unit-label{font-size:25px}
  .unit-subtitle{font-size:11px}
  .unit-tagline{font-size:23px}
  .story-content p{font-size:12px}
  .story-points{display:grid;gap:8px;text-align:left}
  .auth-panel{padding:30px 25px}
  .auth-panel-inner{padding:27px 25px;border-radius:19px}

  .auth-story .brand-name{font-size:28px}

  .auth-panel h2{font-size:32px;margin:10px 0 14px}
  .auth-panel .intro{font-size:14px;margin-bottom:23px;line-height:1.7}
  .auth-panel form{gap:18px}
  .auth-panel form.auth-form-sections{gap:23px}
  .auth-footer{font-size:11px;padding-top:14px;margin-top:24px;gap:3px}

  .demo-actions{grid-template-columns:minmax(0,1fr)}
  .demo-actions .btn{font-size:12px}
  .back-link{font-size:12px;margin-top:-6px;margin-bottom:10px}
  .identity{padding:15px;gap:12px;margin-top:18px}
  .identity-name{font-size:16px}
  .identity-meta{font-size:12px}
  .shell,.workspace{display:block}
  .sidebar{display:none}
  .workspace-watermark{width:275px;right:12px;top:104px;max-height:58vh;opacity:.045}
  .topbar{min-height:85px;padding:13px 18px;gap:12px}

  .mobile-brand .brand-name{font-size:25px;letter-spacing:.05em}

  .topbar-meta .badge{font-size:9px;padding:4px 6px}
  .main{padding:26px 16px calc(111px + env(safe-area-inset-bottom))}
  .page-heading{margin-bottom:23px;gap:15px;align-items:flex-start}
  .page-heading h1{font-size:32px;margin:8px 0 10px}
  .page-heading p{font-size:13px;max-width:480px;line-height:1.75}
  .page-heading .eyebrow{font-size:10px;letter-spacing:.1em}
  .page-heading .btn{font-size:12px;padding:11px 14px;min-height:46px}
  .page-heading .btn svg{width:17px;height:17px}
  .calendar-card{padding:17px 11px;border-radius:14px}
  .calendar-toolbar{padding-bottom:15px;gap:9px;flex-wrap:wrap}
  .calendar-toolbar h2{font-size:19px;flex:1;min-width:0}
  .calendar-nav{gap:3px}
  .calendar-nav .icon-btn{width:44px;height:44px}
  .calendar-nav .btn{padding:10px;min-height:44px;font-size:11px}
  .calendar-context{padding:9px 10px;font-size:11px;line-height:1.65;margin-bottom:17px}
  .calendar-grid,.calendar-weekdays{gap:3px}
  .calendar-day{min-height:69px;padding:8px 6px;gap:9px;border-radius:8px}
  .day-num{font-size:16px}
  .day-tag{display:none}
  .calendar-day.mine::after{content:'✓';position:absolute;right:6px;bottom:7px;font-size:13px;font-weight:700;line-height:1}
  .calendar-day:has(.day-count)::after{display:none}
  .day-dot{right:5px;top:10px;width:4px;height:4px}
  .day-count{font-size:12px;gap:0;max-width:100%}
  .day-count svg{display:none}
  .calendar-weekdays{padding-bottom:11px}
  .calendar-weekdays span{font-size:10px;letter-spacing:.015em}
  .calendar-legend{gap:9px 13px;font-size:11px;margin-top:17px;padding-top:15px}
  .legend-swatch{width:10px;height:10px}
  .sidebar-section{grid-template-columns:minmax(0,1fr);gap:17px}
  .sidebar-section .card{padding:22px}
  .sidebar-section h3{font-size:16px}
  .count-card{display:flex;align-items:center;gap:21px}
  .count-card .big-number{margin:0;font-size:53px;order:-1;min-width:45px}
  .count-card .eyebrow{font-size:10px}
  .count-card p{margin-top:6px;font-size:12px;max-width:235px}
  .date-list{margin-top:17px}
  .date-list-item{padding:14px 0}
  .date-info strong{font-size:13px}
  .date-info span{font-size:12px}
  .info-card{padding:19px}
  .bottom-nav{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);position:fixed;bottom:0;left:0;right:0;min-height:75px;padding:8px 9px calc(8px + env(safe-area-inset-bottom));background:#fbfcf8;border-top:1px solid #d6e0ce;gap:4px;z-index:20;box-shadow:0 -5px 20px #183b3208}
  .bottom-nav button{border:0;background:transparent;color:#5b7154;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;line-height:1.35;padding:7px 5px;border-radius:9px;min-width:0;min-height:56px;overflow-wrap:anywhere}
  .bottom-nav button svg{width:20px;height:20px}
  .bottom-nav button.active{color:var(--forest);background:#e9f0e1;font-weight:650}
  .bottom-nav.admin{padding-left:7px;padding-right:7px;gap:2px}
  .bottom-nav.admin button{font-size:10px;padding:7px 1px;letter-spacing:-.015em;min-width:0}
  .bottom-nav.admin button svg{width:19px;height:19px}
  .app-footer{font-size:10px;margin-top:25px;padding-top:17px}
  .app-footer span:last-child{display:none}
  .section-heading{gap:12px;margin-bottom:14px}
  .section-heading h2,.section-heading h3{font-size:15px}
  .section-heading p{font-size:11px}
  .metrics{gap:11px;margin-bottom:22px}
  .metric{padding:17px;border-radius:13px}
  .metric-top{font-size:11px;gap:7px;min-height:34px}
  .metric strong{font-size:35px;margin-top:11px}
  .metric-top svg{width:17px;height:17px}
  .metric-context{font-size:10px;margin-top:6px}
  .toolbar{flex-wrap:wrap;gap:10px;margin-bottom:17px}
  .toolbar-search{max-width:none;flex-basis:100%}
  .toolbar>#roster-count{padding:0 2px;font-size:11px}
  .search-field{max-width:none;min-width:0}
  .toolbar .btn{font-size:12px;min-height:46px}
  .roster-table table,.roster-table tbody,.roster-table td{display:block}
  .roster-table thead{display:none}
  .roster-table tr{padding:19px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
  .roster-table td{padding:0;border:0;min-width:0}
  .roster-table td:first-child{grid-column:1;overflow-wrap:anywhere}
  .roster-table td[data-label]:before{content:attr(data-label) ": ";color:var(--muted);font-size:11px}
  .roster-table td[data-label]{font-size:12px;grid-column:1}
  .roster-table td.actions-cell{grid-column:2;grid-row:1/5;align-self:center}
  .roster-table .person-cell strong{font-size:14px}
  .roster-table .person-cell small{font-size:11px}
  .roster-table .table-actions{flex-direction:column;gap:3px}
  .roster-table td.status-cell{grid-column:1}
  .roster-table .status-cell .small{display:inline;margin-left:4px;font-size:10px}
  .roster-table tr:last-child{border-bottom:0}
  .roster-table td[colspan]{grid-column:1/-1}
  .audit-table th,.audit-table td{padding:14px;font-size:12px}
  .audit-table th{font-size:10px}
  .audit-table td:first-child{min-width:125px}
  .audit-caption{padding:16px;font-size:11px;min-width:300px}
  .card-pad{padding:22px}
  .card-heading h2{font-size:20px}
  .card-heading p{font-size:13px}
  .form-grid{gap:18px}
  .form-grid.mobile-single{grid-template-columns:minmax(0,1fr)}
  .form-section{gap:17px;padding-top:21px}
  .form-section legend{font-size:13px}
  .profile-summary{gap:12px}
  .profile-summary .avatar{width:49px;height:52px}
  .settings-toggle{gap:17px}
  .settings-toggle strong{font-size:13px}
  .settings-toggle p{font-size:12px}
  dialog{width:calc(100% - 24px);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);border-radius:16px}
  .modal-header{padding:21px 19px 18px;gap:12px}
  .modal-header .eyebrow{font-size:10px}
  .modal-header h2{font-size:27px}
  .modal-body{padding:21px 19px}
  .modal-footer{padding:17px 19px 21px;gap:9px}
  .modal-footer .btn{flex:1 1 auto;font-size:12px;min-height:48px;padding:12px 13px}
  .activation-code{font-size:23px;letter-spacing:.1em;padding:22px 12px}
  .toast-region{bottom:calc(92px + env(safe-area-inset-bottom));left:15px;right:15px;max-width:none}
  .toast{font-size:13px;padding:15px 16px}
  .bulk-bar{padding:12px;gap:10px;font-size:12px}
  .bulk-bar>.row{margin-left:0;width:100%;justify-content:flex-end}
  .bulk-bar .btn{font-size:11px;padding:10px;min-height:44px}
  .mobile-only{display:inline-flex}
}
@media(max-width:400px){
  .auth-story{padding-left:21px;padding-right:21px}
  .auth-panel{padding-left:22px;padding-right:22px}
  .auth-panel h2{font-size:31px}
  .topbar{padding-left:15px;padding-right:15px}
  .topbar-meta{max-width:113px}
  .main{padding-left:12px;padding-right:12px}
  .calendar-card{padding-left:10px;padding-right:10px}
  .calendar-grid,.calendar-weekdays{gap:3px}
  .calendar-toolbar h2{font-size:18px}
  .calendar-nav .btn{padding-left:9px;padding-right:9px}
  .calendar-legend{font-size:10px;gap:9px 12px}
  .metric{padding:16px}
}
@media(max-width:380px){
  .unit-hero{gap:15px}
  .unit-label{font-size:22px}
  .unit-tagline{font-size:18px}
  .main{padding-left:10px;padding-right:10px}
  .calendar-card{padding-left:8px;padding-right:8px}
  .calendar-grid,.calendar-weekdays{gap:2px}
  .calendar-toolbar{gap:8px}
  .calendar-nav .btn{padding-left:7px;padding-right:7px}
  .calendar-day{padding-left:5px;padding-right:5px;min-height:67px}
  .mobile-brand{gap:9px}
  .mobile-brand .unit-crest{width:43px;height:52px}
  .mobile-brand .brand-name{font-size:24px}
  .mobile-brand .brand-caption{max-width:116px;font-size:8px}
  .topbar-meta{max-width:102px}
  .card-pad{padding:20px}
  .bottom-nav.admin button{font-size:9.5px;letter-spacing:-.02em}
}
@media(max-width:350px){
  .main{padding-left:8px;padding-right:8px}
  .calendar-card{width:calc(100% + 16px);margin-left:-8px;margin-right:-8px;padding-left:4px;padding-right:4px;border-left:0;border-right:0;border-radius:0}
  .calendar-grid,.calendar-weekdays{column-gap:0;row-gap:4px}
  .calendar-day{border-radius:7px}
  .bottom-nav{padding-left:3px;padding-right:3px;gap:0}
  .topbar-meta{max-width:85px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>

// restoration wait for an attestation from our exact, top-level Pages host.
function startInTrustedHost(){
 if(!config.embedOrigin){start();return;}
 const origin='https://appdrso.github.io';
 function blocked(){app.innerHTML='<main class="loading" id="main"><h1>Abra pelo endereço do DRSO</h1><p>Não foi possível confirmar a página de acesso.</p><a class="btn" id="embed-reopen" href="'+origin+'/" target="_top">Abrir o DRSO</a></main>';}
 if(config.embedOrigin!==origin||window.self===window.top||!window.crypto||typeof window.crypto.getRandomValues!=='function'){blocked();return;}
 let nonce;
 try{nonce=Array.from(window.crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');}catch(e){blocked();return;}
 app.innerHTML='<main class="loading" id="main" role="status"><div class="spinner"></div><p>Abrindo o DRSO…</p></main>';
 let settled=false;
 const timeout=setTimeout(()=>{if(settled)return;settled=true;window.removeEventListener('message',receive);blocked();},10000);
 function receive(event){
  const data=event.data;
  if(settled||event.source!==window.top||event.origin!==origin||!data||data.type!=='drso:embed:allow'||data.version!==1||data.nonce!==nonce)return;
  settled=true;clearTimeout(timeout);window.removeEventListener('message',receive);
  start();
  window.top.postMessage({type:'drso:embed:ready',version:1,nonce:nonce},origin);
 }
 window.addEventListener('message',receive);
 window.top.postMessage({type:'drso:embed:hello',version:1,nonce:nonce},origin);
}
startInTrustedHost();
})();
