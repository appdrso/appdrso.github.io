  <script id="drso-viewport-guard">
    (function () {

      // Each browsing context needs its own guard; events do not cross iframes.
      // Browser chrome and accessibility zoom remain under the user's control.
      var options = {capture: true, passive: false};
      function preventZoom(event) {
        if (event.cancelable) event.preventDefault();
      }
      document.addEventListener('touchmove', function (event) {
        if (event.touches && event.touches.length > 1) preventZoom(event);
      }, options);
      document.addEventListener('gesturestart', preventZoom, options);
      document.addEventListener('gesturechange', preventZoom, options);
      document.addEventListener('wheel', function (event) {
        if (event.ctrlKey) preventZoom(event);
      }, options);
      document.addEventListener('keydown', function (event) {
        if (!(event.ctrlKey || event.metaKey) || event.altKey || event.isComposing) return;
        if (['+', '=', '-', '_', '0'].indexOf(event.key) !== -1) preventZoom(event);
      }, options);
    }());

    (function () {

      var approved = null;
      var timeout = null;
      var ready = false;
      var generation = 0;

      // Authentication inside DRSO still uses its own matrícula/password.
      var EMBED_URL = APP_URL + '?authuser=0&embed=1';

        window.visualViewport.addEventListener('resize', fitViewport);
        window.visualViewport.addEventListener('scroll', fitViewport);
      }
      fitViewport();

      function showFallback(title, message) {
        document.getElementById('status-title').textContent = title;
        document.getElementById('status-message').textContent = message;
        status.hidden = false;
        splash.hidden = true;

      if (window.self !== window.top || window.location.origin !== HOST_ORIGIN) {

      frame.hidden = false;

        try {

      // WindowProxy frames, length and numeric indices are cross-origin

        if (!source) return false;

        var seen = [];

        while (pending.length && checked < 24) {

          seen.push(current);

          try {

          return;

        ready = true;
        window.clearTimeout(timeout);

        status.hidden = true;
        splash.hidden = true;

        var attempt = ++generation;
        window.clearTimeout(timeout);
        timeout = window.setTimeout(function () {
          if (ready || attempt !== generation) return;
          showFallback('Não foi possível abrir o DRSO', 'Tente novamente ou use o acesso direto pelo Google.');

        ready = false;

        frame = next;
        watchStartup();
        frame.src = EMBED_URL;
      }

      document.getElementById('retry-link').addEventListener('click', function (event) {
        event.preventDefault();
        if (ready) return;
        replaceFrame('credentialless' in frame);
        showFallback('Reconectando ao DRSO', 'Aguarde enquanto o aplicativo é aberto novamente.');

      watchStartup();

    }());
