<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#173e32">
  <title>DRSO — Gestão de Voluntariado</title>
  <meta name="apple-mobile-web-app-title" content="DRSO">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=0832">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon-v067.png">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #173e32; background: #f4f6f5; }
    html, body { touch-action: pan-x pan-y; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; overflow: hidden; }
    #app-frame { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; background: #f4f6f5; }
    #embed-status, .no-script { position: fixed; z-index: 2; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); max-width: 440px; margin: 0 auto; padding: 20px; border: 1px solid #deded3; border-radius: 14px; background: #fff; box-shadow: 0 8px 32px #173e3220; }
    h1 { margin: 0 0 8px; font-size: 18px; line-height: 1.35; }
    p { margin: 0 0 12px; color: #596b63; font-size: 14px; line-height: 1.5; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .actions a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 14px; border-radius: 9px; color: #174f3b; font-weight: 600; font-size: 14px; text-align: center; text-decoration: none; }
    .actions a:hover { background: #f0f4ed; }
    #retry-link { background: #174f3b; color: #fff; }
    #retry-link:hover { background: #103b2c; }
    a:focus-visible { outline: 3px solid #b78f3b; outline-offset: 3px; }
  </style>
  <script id="drso-viewport-guard">
    (function () {
      'use strict';
      // Each browsing context needs its own guard; events do not cross iframes.
      // Browser chrome and accessibility zoom remain under the user's control.
      var options = {capture: true, passive: false};
      function preventZoom(event) {
        if (event.cancelable) event.preventDefault();
      }
      document.addEventListener('touchmove', function (event) {
        if (event.touches && event.touches.length > 1) preventZoom(event);
      }, options);
      document.addEventListener('gesturestart', preventZoom, options);
      document.addEventListener('gesturechange', preventZoom, options);
      document.addEventListener('wheel', function (event) {
        if (event.ctrlKey) preventZoom(event);
      }, options);
      document.addEventListener('keydown', function (event) {
        if (!(event.ctrlKey || event.metaKey) || event.altKey || event.isComposing) return;
        if (['+', '=', '-', '_', '0'].indexOf(event.key) !== -1) preventZoom(event);
      }, options);
    }());
  </script>
</head>
<body>
  <aside id="embed-status" hidden role="status" aria-live="polite" aria-atomic="true">
    <h1 id="status-title">O aplicativo está demorando para carregar</h1>
    <p id="status-message">Você pode aguardar ou tentar abrir novamente.</p>
    <div class="actions">
      <a id="retry-link" href="https://appdrso.github.io/" target="_top">Recarregar</a>
      <a id="direct-link" href="https://script.google.com/macros/s/AKfycbzUTpcAv8pB1Je0YexaMLozmBg5_H90lpj4FZGD2HDTdAxfmd36-qBFVGBGFz11cOqo/exec" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">Abrir no Google</a>
    </div>
  </aside>
  <noscript><p class="no-script">Ative o JavaScript no navegador para abrir o aplicativo.</p></noscript>
  <iframe id="app-frame" title="DRSO — Gestão de Voluntariado" hidden aria-hidden="true" referrerpolicy="no-referrer"></iframe>
  <script>
    (function () {
      'use strict';
      var HOST_ORIGIN = 'https://appdrso.github.io';
      var APP_URL = 'https://script.google.com/macros/s/AKfycbzUTpcAv8pB1Je0YexaMLozmBg5_H90lpj4FZGD2HDTdAxfmd36-qBFVGBGFz11cOqo/exec';
      var frame = document.getElementById('app-frame');
      var status = document.getElementById('embed-status');
      var approved = null;
      var timeout = null;

      function showFallback(title, message) {
        document.getElementById('status-title').textContent = title;
        document.getElementById('status-message').textContent = message;
        status.hidden = false;
      }

      // A copied or itself embedded host must not approve the application's
      // startup. The iframe has no src until this check has passed.
      if (window.self !== window.top || window.location.origin !== HOST_ORIGIN) {
        showFallback('Abra o DRSO diretamente', 'Use o botão abaixo para acessar o aplicativo.');
        return;
      }

      // The app controls its own trusted startup. Give its iframe the full
      // viewport immediately instead of inserting a separate landing page.
      frame.hidden = false;
      frame.removeAttribute('aria-hidden');
      frame.setAttribute('aria-busy', 'true');

      function googleOrigin(origin) {
        if (typeof origin !== 'string') return false;
        try {
          var url = new URL(origin);
          return url.origin === origin && url.protocol === 'https:' && !url.port &&
            (url.hostname === 'script.google.com' || url.hostname.endsWith('.googleusercontent.com'));
        } catch (error) { return false; }
      }

      // Apps Script places the application inside its own sandbox iframe.
      // WindowProxy frames, length and numeric indices are cross-origin
      // accessible; no remote DOM or location is read. Bound traversal even
      // if a frame changes or closes while its message is being handled.
      function containsSender(source) {
        if (!source) return false;
        var pending = [{value: frame.contentWindow, depth: 0}];
        var seen = [];
        var checked = 0;
        while (pending.length && checked < 24) {
          var entry = pending.shift();
          var current = entry.value;
          if (!current || seen.indexOf(current) !== -1) continue;
          seen.push(current);
          checked++;
          if (current === source) return true;
          if (entry.depth >= 4) continue;
          try {
            var count = Math.min(current.length, 24);
            for (var index = 0; index < count && pending.length < 24; index++) {
              pending.push({value: current.frames[index], depth: entry.depth + 1});
            }
          } catch (error) { /* A vanished or inaccessible branch cannot match. */ }
        }
        return false;
      }

      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || typeof data !== 'object' || Array.isArray(data) || data.version !== 1 ||
            typeof data.nonce !== 'string' || !/^[0-9a-f]{32}$/.test(data.nonce) ||
            (data.type !== 'drso:embed:hello' && data.type !== 'drso:embed:ready') ||
            !googleOrigin(event.origin) || !containsSender(event.source)) return;

        if (data.type === 'drso:embed:hello') {
          approved = {source: event.source, origin: event.origin, nonce: data.nonce};
          try {
            event.source.postMessage({type: 'drso:embed:allow', version: 1, nonce: data.nonce}, event.origin);
          } catch (error) { approved = null; }
          return;
        }

        if (!approved || event.source !== approved.source || event.origin !== approved.origin ||
            data.nonce !== approved.nonce) return;
        window.clearTimeout(timeout);
        frame.removeAttribute('aria-busy');
        status.hidden = true;
      });

      // A load event also fires for some blocked frames. Only the application's
      // nonce-bound READY message confirms startup and cancels recovery UI.
      timeout = window.setTimeout(function () {
        showFallback('O acesso está demorando', 'Você pode aguardar mais um pouco ou abrir o aplicativo pelo botão abaixo.');
      }, 20000);
      frame.src = APP_URL + '?embed=1';
    }());
  </script>
</body>
</html>
